name: Bug report
description: Something in Mortimeter did not work the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the app did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in by the app when you came from Settings. Otherwise, Settings, About shows it.
  - type: input
    id: device
    attributes:
      label: Device
      description: Windows, Android, or the browser, and which.
